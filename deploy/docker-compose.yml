# Production stack for the shared VPS. Postgres/Redis are NOT defined here - both apps
# (url_short, kb) share one Postgres and one Redis instance, brought up separately from
# /opt/stack/data/docker-compose.yml. The global Caddy proxy (also a separate stack, in
# /opt/stack/proxy/) routes to these services by Docker DNS name over the `edge` network - none
# of them publish a host port.
name: kb

services:

  api:
    image: ghcr.io/${GHCR_OWNER}/kb-api:${IMAGE_TAG}
    container_name: kb-api
    restart: on-failure:5
    labels:
      sablier.enable: "true"
      sablier.group: "kb"
    environment:
      RUN_MIGRATIONS: "1"
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Refuse to start if that role turns out to bypass RLS (superuser or BYPASSRLS). A
      # dormant backstop looks identical to a working one from the outside, so this is the
      # only place it can be caught. See apps/api/scripts/create_app_role.sql.
      REQUIRE_RLS: "1"
      CACHE_URL: redis://redis:6379/1
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      # Public client id, used to verify the ID tokens the browser's Google button returns.
      # Defaulted so an unset value leaves Google sign-in cleanly disabled (503) instead of
      # making compose fail to interpolate.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AICREDITS_API_KEY: ${AICREDITS_API_KEY}
      AICREDITS_BASE_URL: ${AICREDITS_BASE_URL:-https://api.aicredits.in/v1}
      AICREDITS_CHAT_MODEL: ${AICREDITS_CHAT_MODEL:-openai/gpt-4o-mini}
      AICREDITS_EMBEDDING_MODEL: ${AICREDITS_EMBEDDING_MODEL:-text-embedding-3-small}
      FILEBASE_ACCESS_KEY: ${FILEBASE_ACCESS_KEY}
      FILEBASE_SECRET_KEY: ${FILEBASE_SECRET_KEY}
      FILEBASE_BUCKET_NAME: ${FILEBASE_BUCKET_NAME}
      FILEBASE_ENDPOINT: ${FILEBASE_ENDPOINT:-https://s3.filebase.io}
    # PDF parsing moved from Docling (torch, ~18GB image with the CUDA bundle it kept
    # resolving) to PyMuPDF4LLM (pure Python, no model weights) - no /models volume needed
    # anymore, and these limits are a conservative guess pending a real measurement on the
    # next deploy. Re-measure with `docker stats` and tighten once there's real data, the same
    # way the old torch-based numbers were derived.
    mem_limit: 512m
    mem_reservation: 192m
    cpus: 1.0
    networks: [edge, data]

  worker:
    image: ghcr.io/${GHCR_OWNER}/kb-api:${IMAGE_TAG}
    container_name: kb-worker
    restart: on-failure:5
    depends_on:
      api:
        condition: service_healthy
    command: ["procrastinate", "--app=src.infrastructure.queue.app.app", "worker"]
    labels:
      sablier.enable: "true"
      sablier.group: "kb"
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CACHE_URL: redis://redis:6379/1
      JWT_SECRET: ${JWT_SECRET}
      AICREDITS_API_KEY: ${AICREDITS_API_KEY}
      AICREDITS_BASE_URL: ${AICREDITS_BASE_URL:-https://api.aicredits.in/v1}
      AICREDITS_CHAT_MODEL: ${AICREDITS_CHAT_MODEL:-openai/gpt-4o-mini}
      AICREDITS_EMBEDDING_MODEL: ${AICREDITS_EMBEDDING_MODEL:-text-embedding-3-small}
      FILEBASE_ACCESS_KEY: ${FILEBASE_ACCESS_KEY}
      FILEBASE_SECRET_KEY: ${FILEBASE_SECRET_KEY}
      FILEBASE_BUCKET_NAME: ${FILEBASE_BUCKET_NAME}
      FILEBASE_ENDPOINT: ${FILEBASE_ENDPOINT:-https://s3.filebase.io}
    # Same reasoning as the api service above - PyMuPDF4LLM needs no thread-count tuning or
    # model-weight volume the way Docling/torch did.
    mem_limit: 512m
    mem_reservation: 96m
    cpus: 1.0
    networks: [data]

  web:
    image: ghcr.io/${GHCR_OWNER}/kb-web:${IMAGE_TAG}
    container_name: kb-web
    restart: on-failure:5
    labels:
      sablier.enable: "true"
      sablier.group: "kb"
    mem_limit: 256m
    mem_reservation: 96m
    cpus: 0.5
    networks: [edge]

  website:
    image: ghcr.io/${GHCR_OWNER}/kb-website:${IMAGE_TAG}
    container_name: kb-website
    restart: on-failure:5
    labels:
      sablier.enable: "true"
      sablier.group: "kb"
    mem_limit: 256m
    mem_reservation: 96m
    cpus: 0.5
    networks: [edge]

networks:
  edge:
    external: true
  data:
    external: true
