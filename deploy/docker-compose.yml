# Production stack for the VPS. See VPS-PLAYBOOK.md for the box's constraints.
#
# The VPS sits behind AIC's shared proxy, which terminates TLS and forwards plain HTTP to
# ONE port. So exactly one service publishes a port — caddy — and it routes by path to the
# three app containers. Everything else stays on the internal network, unreachable from
# outside the stack.
name: saga

services:

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
      website:
        condition: service_started
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      # All interfaces: AIC's proxy arrives over the private network, not loopback. Safe
      # because the VPS has no public IPv4 of its own. Container listens on 80 — no TLS here.
      - "${APP_PORT}:80"
    networks: [internal]

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes the $ from compose so the container's shell expands it.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 768m
    networks: [internal]
    # No published ports — never expose a database to the host.

  api:
    image: ghcr.io/${GHCR_OWNER}/saga-api:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Only the api migrates; the worker must not race it (see docker-entrypoint.sh).
      RUN_MIGRATIONS: "1"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      # Same-origin in production, so CORS is never exercised; kept explicit and empty-ish.
      CORS_ALLOWED_ORIGINS: ${APP_BASE_URL}
      AICREDITS_API_KEY: ${AICREDITS_API_KEY}
      AICREDITS_BASE_URL: ${AICREDITS_BASE_URL:-https://api.aicredits.in/v1}
      AICREDITS_CHAT_MODEL: ${AICREDITS_CHAT_MODEL:-openai/gpt-4o-mini}
      AICREDITS_EMBEDDING_MODEL: ${AICREDITS_EMBEDDING_MODEL:-text-embedding-3-small}
      FILEBASE_ACCESS_KEY: ${FILEBASE_ACCESS_KEY}
      FILEBASE_SECRET_KEY: ${FILEBASE_SECRET_KEY}
      FILEBASE_BUCKET_NAME: ${FILEBASE_BUCKET_NAME}
      FILEBASE_ENDPOINT: ${FILEBASE_ENDPOINT:-https://s3.filebase.io}
    mem_limit: 1g
    networks: [internal]

  worker:
    image: ghcr.io/${GHCR_OWNER}/saga-api:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      # Waits for the api's healthcheck, which means migrations have already run.
      api:
        condition: service_healthy
    command: ["procrastinate", "--app=src.infrastructure.queue.app.app", "worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      AICREDITS_API_KEY: ${AICREDITS_API_KEY}
      AICREDITS_BASE_URL: ${AICREDITS_BASE_URL:-https://api.aicredits.in/v1}
      AICREDITS_CHAT_MODEL: ${AICREDITS_CHAT_MODEL:-openai/gpt-4o-mini}
      AICREDITS_EMBEDDING_MODEL: ${AICREDITS_EMBEDDING_MODEL:-text-embedding-3-small}
      FILEBASE_ACCESS_KEY: ${FILEBASE_ACCESS_KEY}
      FILEBASE_SECRET_KEY: ${FILEBASE_SECRET_KEY}
      FILEBASE_BUCKET_NAME: ${FILEBASE_BUCKET_NAME}
      FILEBASE_ENDPOINT: ${FILEBASE_ENDPOINT:-https://s3.filebase.io}
    # Docling parsing is the memory-hungry part of this stack; cap it or it crowds out Postgres.
    mem_limit: 1500m
    networks: [internal]

  web:
    image: ghcr.io/${GHCR_OWNER}/saga-web:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    networks: [internal]

  website:
    image: ghcr.io/${GHCR_OWNER}/saga-website:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    networks: [internal]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
