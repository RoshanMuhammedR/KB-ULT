[project]
name = "kb-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.3",
  "boto3>=1.35.90",
  "fastapi>=0.115.6",
  "httpx>=0.27",
  # The langfuse<->langchain bridge imports `langchain` itself purely to branch on
  # `langchain.__version__`; without the meta-package installed it raises ModuleNotFoundError
  # and tracing silently disables itself. Everything it actually uses lives in langchain-core.
  "langchain>=1.0",
  "langchain-classic>=1.0.8",
  "langchain-community>=0.3.14",
  "langchain-openai>=0.2.14",
  "langchain-text-splitters>=0.3.5",
  "langfuse>=3.0",
  "pgvector>=0.3.6",
  "procrastinate>=2.9.0",
  "psycopg[binary,pool]>=3.2.3",
  "pwdlib[argon2]>=0.2.1",
  "pydantic-settings>=2.7.1",
  # [crypto] pulls `cryptography` for RS256, needed to verify Google ID tokens locally.
  "pyjwt[crypto]>=2.9.0",
  "pymupdf4llm>=0.0.17",
  "python-multipart>=0.0.20",
  # Pure Python over lxml/Pillow — no compilation, no ML runtime.
  "python-pptx>=1.0.2",
  # One client for both environments: local Valkey and the shared production Redis both
  # speak RESP, and redis-py ships `redis.asyncio`, which the async cache layer needs.
  "redis>=5.2",
  "sqlalchemy>=2.0.36",
  "structlog>=24.4.0",
  "tiktoken>=0.8.0",
  "uvicorn[standard]>=0.34.0",
  # 1.x floor: the handler uses the instance API (`YouTubeTranscriptApi().list(...)`) and
  # `youtube_transcript_api.proxies`, neither of which exists in 0.6.x.
  "youtube-transcript-api>=1.2"
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
exclude = ["alembic*", "scripts*"]
