name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false # never kill a deploy midway

permissions:
  contents: read
  packages: write

jobs:

  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      owner: ${{ steps.v.outputs.owner }}
    steps:
      - id: v
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"   # GHCR needs lowercase

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # The API image serves both the api and the worker services.
          - service: saga-api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile
          # Both Next apps build from the repo root: it is a pnpm workspace.
          - service: saga-web
            context: .
            dockerfile: ./apps/web/Dockerfile
          - service: saga-website
            context: .
            dockerfile: ./apps/website/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # built-in, no PAT needed to push
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.service }}:${{ needs.prepare.outputs.tag }}
            ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Sync deploy files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
        # .env is rendered in the next step, and .image-tag is deploy state owned by the
        # server — neither may be clobbered by the sync.
        run: |
          rsync -az --delete --exclude '.env' --exclude '.image-tag' --exclude 'backups/' \
            -e "ssh -p $VPS_PORT -o StrictHostKeyChecking=yes" \
            deploy/ "$VPS_USER@$VPS_HOST:/opt/saga/"

      - name: Render .env on the server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          # Non-secret configuration: variables, so it stays readable and reviewable.
          IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
          APP_PORT: ${{ vars.APP_PORT }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          GHCR_OWNER: ${{ needs.prepare.outputs.owner }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          ACCESS_TOKEN_TTL_SECONDS: ${{ vars.ACCESS_TOKEN_TTL_SECONDS || '900' }}
          REFRESH_TOKEN_TTL_SECONDS: ${{ vars.REFRESH_TOKEN_TTL_SECONDS || '2592000' }}
          AICREDITS_BASE_URL: ${{ vars.AICREDITS_BASE_URL || 'https://api.aicredits.in/v1' }}
          AICREDITS_CHAT_MODEL: ${{ vars.AICREDITS_CHAT_MODEL || 'openai/gpt-4o-mini' }}
          AICREDITS_EMBEDDING_MODEL: ${{ vars.AICREDITS_EMBEDDING_MODEL || 'text-embedding-3-small' }}
          FILEBASE_BUCKET_NAME: ${{ vars.FILEBASE_BUCKET_NAME }}
          FILEBASE_ENDPOINT: ${{ vars.FILEBASE_ENDPOINT || 'https://s3.filebase.io' }}
          # PDF parsing cost knobs. Table structure runs a second torch model over every
          # detected table and is the most expensive stage on a 2-vCPU box; set the
          # DOCLING_DO_TABLE_STRUCTURE variable to "true" to trade latency for structured
          # tables. Empty here is fine — compose supplies the same defaults.
          DOCLING_DO_TABLE_STRUCTURE: ${{ vars.DOCLING_DO_TABLE_STRUCTURE || 'false' }}
          DOCLING_NUM_THREADS: ${{ vars.DOCLING_NUM_THREADS || '2' }}
          DOCLING_TIMEOUT_SECONDS: ${{ vars.DOCLING_TIMEOUT_SECONDS || '180' }}
          # Real credentials.
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AICREDITS_API_KEY: ${{ secrets.AICREDITS_API_KEY }}
          FILEBASE_ACCESS_KEY: ${{ secrets.FILEBASE_ACCESS_KEY }}
          FILEBASE_SECRET_KEY: ${{ secrets.FILEBASE_SECRET_KEY }}
        # Never `cat` the rendered file: Actions masks registered secrets in logs, but the
        # habit of not printing them is what keeps that true when someone adds a new one.
        run: |
          set -eu

          # Fail loudly rather than render an empty credential. An empty JWT_SECRET would
          # silently sign tokens with "", and an empty POSTGRES_PASSWORD locks the app out
          # of its own database.
          missing=""
          for required in APP_PORT APP_BASE_URL POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD JWT_SECRET; do
            eval "value=\${$required:-}"
            [ -n "$value" ] || missing="$missing $required"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing required secret/variable:$missing"
            echo "Set them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # The third-party keys are allowed to be empty — signup and login work without
          # them; only ingestion and chat need them. Warn so it is not a silent surprise.
          for optional in AICREDITS_API_KEY FILEBASE_ACCESS_KEY FILEBASE_SECRET_KEY; do
            eval "value=\${$optional:-}"
            [ -n "$value" ] || echo "::warning::$optional is empty — ingestion/chat will fail until it is set"
          done

          envsubst < deploy/.env.tmpl > /tmp/rendered.env
          test -s /tmp/rendered.env

          # Written to a temp file and moved into place, so a dropped connection can never
          # leave a half-written .env behind.
          ssh -p "$VPS_PORT" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'umask 077 && cat > /opt/saga/.env.new && mv /opt/saga/.env.new /opt/saga/.env' \
            < /tmp/rendered.env
          rm -f /tmp/rendered.env
          echo "rendered $(wc -l < deploy/.env.tmpl) lines of config to /opt/saga/.env"

      - name: Run deploy script
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          ssh -p "$VPS_PORT" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "chmod +x /opt/saga/*.sh && /opt/saga/deploy.sh '$TAG'"
