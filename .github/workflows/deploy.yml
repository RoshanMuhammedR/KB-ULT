name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-kb
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      owner: ${{ steps.tag.outputs.owner }}
    steps:
      - id: tag
        run: |
          echo "tag=sha-$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: kb-api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile
            build_args: ""
          - image: kb-web
            context: .
            dockerfile: ./apps/web/Dockerfile
            # Next.js inlines NEXT_PUBLIC_* into the browser bundle at build time, so this
            # cannot be supplied as a runtime container env the way the api's copy is. A
            # Google client id is public by design (it ships in the bundle either way), which
            # is why it lives in `vars` rather than `secrets`.
            build_args: NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
          - image: kb-website
            context: .
            dockerfile: ./apps/website/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          # No NEXT_PUBLIC_* build-args here on purpose: apps/web and apps/website both
          # default to relative paths (`/api`, `/app`, `/`) when these are unset, which is
          # correct behind Caddy's single-origin routing and survives switching between the
          # bare IP and either real domain without a rebuild. Baking in an absolute
          # APP_BASE_URL here previously sent users to the bare-IP host on every
          # login/get-started click regardless of which domain they arrived on.
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.image }}:${{ needs.prepare.outputs.tag }}
            ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.image }}:latest

  deploy:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Render .env and rsync deploy/ to the VPS
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y sshpass rsync
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

          sshpass -e rsync -az --delete -e "ssh -p ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=no" \
            --exclude '.env' \
            deploy/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/stack/kb/

          cat > /tmp/kb.env <<EOF
          GHCR_OWNER=${{ needs.prepare.outputs.owner }}
          IMAGE_TAG=${{ needs.prepare.outputs.tag }}
          POSTGRES_DB=kb
          APP_DB_USER=kb_app
          APP_BASE_URL=${{ secrets.APP_BASE_URL }}
          CORS_ALLOWED_ORIGINS=http://37.187.140.45:8082,http://saga.dedyn.io,https://saga.dedyn.io
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
          AICREDITS_API_KEY=${{ secrets.AICREDITS_API_KEY }}
          AICREDITS_BASE_URL=https://api.aicredits.in/v1
          AICREDITS_CHAT_MODEL=openai/gpt-4o-mini
          AICREDITS_EMBEDDING_MODEL=text-embedding-3-small
          AICREDITS_FAST_MODEL=openai/gpt-4o-mini
          FILEBASE_ACCESS_KEY=${{ secrets.FILEBASE_ACCESS_KEY }}
          FILEBASE_SECRET_KEY=${{ secrets.FILEBASE_SECRET_KEY }}
          FILEBASE_BUCKET_NAME=${{ secrets.FILEBASE_BUCKET_NAME }}
          FILEBASE_ENDPOINT=https://s3.filebase.io
          LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST=${{ secrets.LANGFUSE_HOST }}
          EOF

          sshpass -e scp -P ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=no \
            /tmp/kb.env ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/stack/kb/.env
          rm -f /tmp/kb.env

          # kb_app's password is generated by, and lives with, the data stack that owns
          # Postgres. Reading it on the box keeps exactly one copy of it. Duplicating it
          # into a GitHub secret is what let the two drift apart and took the API down.
          sshpass -e ssh -p ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'set -eu; PW=$(grep "^KB_DB_PASSWORD=" /opt/stack/data/.env | cut -d= -f2- | tr -d "\""); [ -n "$PW" ] || { echo "KB_DB_PASSWORD missing from /opt/stack/data/.env" >&2; exit 1; }; printf "APP_DB_PASSWORD=%s\n" "$PW" >> /opt/stack/kb/.env'

      # Reclaim disk BEFORE pulling, not after deploying.
      #
      # `deploy.sh` prunes on its success path with `--filter until=72h`, which at this push
      # cadence reclaims nothing: every image on the box is younger than the window. So the
      # disk only ever grew — four images per commit, ~3.2GB a push — until it filled and
      # `docker compose pull` started failing with "no space left on device".
      #
      # That failure is silent in a specific way. `set -e` aborts deploy.sh before it writes
      # anything to the deploy log, so the newest row stays the last *successful* one. Five
      # consecutive deploys failed this way and the only symptom was a fix that had been
      # merged, built, and pushed to the registry, and was not running.
      #
      # Scoped to this project's images, on a host shared with other stacks, and never to an
      # image a running container holds — which is what keeps deploy.sh's rollback target
      # alive until the new version is healthy.
      - name: Reclaim disk on the VPS before pulling
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'set -eu
            IN_USE=$(docker ps --format "{{.Image}}" | sort -u)
            docker images --format "{{.Repository}}:{{.Tag}}" \
              | grep -E "/kb-(api|web|website):" \
              | while read -r ref; do
                  printf "%s\n" "$IN_USE" | grep -qxF "$ref" && continue
                  echo "removing $ref"
                  docker rmi "$ref" >/dev/null 2>&1 || true
                done
            docker image prune -f >/dev/null 2>&1 || true
            df -h / | tail -1
            AVAIL=$(df -BG --output=avail / | tail -1 | tr -dc "0-9")
            # Named, before the pull, rather than a confusing mid-layer write error after it.
            [ "${AVAIL:-0}" -ge 8 ] || { echo "Only ${AVAIL}G free on / - refusing to deploy" >&2; exit 1; }'

      - name: Run the shared deploy script on the VPS
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "bash /opt/stack/scripts/deploy.sh kb ${{ needs.prepare.outputs.tag }} ${{ github.sha }}"
