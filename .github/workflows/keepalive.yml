name: Keep-alive

# Supabase pauses a free project after 7 days without activity. Waking the API is enough to
# count: on boot it checks RLS against the database and the in-process queue worker starts
# polling it. Render's cold start is 30-60s, hence the long timeout.
#
# GitHub disables scheduled workflows after 60 days with no commits; re-enable it from the
# Actions tab if that happens.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 120 https://saga.dedyn.io/api/health
