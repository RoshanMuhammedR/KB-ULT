name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  web:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      # Only the two Next apps: the root `build` script fans out to every workspace,
      # including @kb/api, whose build needs the Python virtualenv this job has no reason to
      # create (the `api` job below covers it). Calling turbo directly also skips
      # scripts/run.mjs, which expects a .env that CI does not have.
      - run: pnpm exec turbo run build --filter=@kb/web --filter=@kb/website
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_PRODUCT_URL: /app
          NEXT_PUBLIC_WEBSITE_URL: /

  api:
    name: API (compile + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Compile
        run: python -m compileall -q src
      - name: Import the app
        # Catches broken imports that compileall cannot see.
        run: python -c "import src.main"
      - name: Unit tests
        run: python -m unittest discover tests
