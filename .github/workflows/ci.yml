name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  web:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      # `lint` is `next build` in both Next apps, so this typechecks and builds in one pass.
      - run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_PRODUCT_URL: /app
          NEXT_PUBLIC_WEBSITE_URL: /

  api:
    name: API (compile + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Compile
        run: python -m compileall -q src
      - name: Import the app
        # Catches broken imports that compileall cannot see.
        run: python -c "import src.main"
      - name: Unit tests
        run: python -m unittest discover tests
