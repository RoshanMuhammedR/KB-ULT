# Local backend stack: Postgres + the API + the ingestion worker. The two Next apps run with
# `pnpm run dev` (production serves them from Vercel, not from containers).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kb_new}
      POSTGRES_USER: ${POSTGRES_USER:-kb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kb_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kb_user} -d ${POSTGRES_DB:-kb_new}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://kb_user:kb_password@db:5432/kb_new
      # ORM sessions connect as the non-superuser `kb_app` role (derived from DATABASE_URL
      # plus this password) so RLS applies. The entrypoint creates the role on boot.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-kb_app_password}
      # The entrypoint migrates before starting; only this service may, so the worker below
      # never races it.
      RUN_MIGRATIONS: "1"
    # Source is bind-mounted, so keep --reload here (the image's default CMD does not).
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy

  # Ingestion worker: same image/code as the api, but runs the Procrastinate worker
  # instead of uvicorn. It consumes ingestion jobs from the Postgres-backed queue and
  # runs the extract -> chunk -> embed pipeline. Scale with `--scale worker=N`.
  # (Production runs this inside the api process instead: RUN_WORKER_IN_PROCESS=1.)
  worker:
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://kb_user:kb_password@db:5432/kb_new
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-kb_app_password}
    command: procrastinate --app=src.infrastructure.queue.app.app worker
    # Same image as the api, but no HTTP server — so the inherited HEALTHCHECK would fail
    # forever. Disable it rather than let the worker report a false "unhealthy".
    healthcheck:
      disable: true
    volumes:
      - ./apps/api:/app
    depends_on:
      # Waits for the api's healthcheck, which means migrations have already finished.
      api:
        condition: service_healthy
      db:
        condition: service_healthy

volumes:
  kb_postgres_data:
